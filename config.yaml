# Tunables for WNBA props model. Every magic number lives here.

# Seasons to ingest (inclusive). 2026 may be mid-season; ingest what exists.
start_season: 2019
end_season: 2026

# Current focus season (used by later phases).
season: 2026

# Possession estimation: POSS ≈ FGA − OREB + TOV + fta_possession_factor × FTA
# 0.44 is NBA-derived; approximately right for WNBA, not exact.
fta_possession_factor: 0.44

# Minutes: regulation team-minutes and per OT period (WNBA: 40-min game, 5-min OT).
regulation_team_minutes: 200
ot_team_minutes: 25
regulation_periods: 4

# Expected regular-season games per team (published schedule length).
# Used only for validation; mid-season incompleteness is explained, not forced.
schedule_length:
  2019: 34
  2020: 22
  2021: 32
  2022: 36
  2023: 40
  2024: 40
  2025: 44
  2026: 44

# Season date windows including playoffs (inclusive) for date validation.
season_windows:
  2019:
    start: "2019-05-24"
    end: "2019-10-10"
  2020:
    start: "2020-07-25"
    end: "2020-10-10"
  2021:
    start: "2021-05-14"
    end: "2021-10-20"
  2022:
    start: "2022-05-06"
    end: "2022-10-20"
  2023:
    start: "2023-05-19"
    end: "2023-10-20"
  2024:
    start: "2024-05-14"
    end: "2024-10-20"
  2025:
    start: "2025-05-16"
    end: "2025-10-20"
  2026:
    start: "2026-05-08"
    end: "2026-10-15"

# Non-franchise abbreviations (All-Star / exhibition) excluded from schedule checks
# and from DB ingest so expansion/franchise pipelines stay clean.
exclude_team_abbreviations:
  - WIL
  - STE
  - WNBASTARS
  - USA
  - COL
  - CLA
  - COOP
  - SPO

# Tolerance (minutes) when checking team minutes sum ≈ 200 + 25×OT.
# ESPN player minutes are rounded; franchise sums commonly land at 198–203.
minutes_sum_tolerance: 3.5

# Paths
db_path: data/wnba.db
raw_stats_dir: data/raw/stats

# --- Phase 2: Odds API (the-odds-api.com) ---
# Sport key verified against Odds API docs: basketball_wnba.
# Player props require the event-odds endpoint (one game per call).
odds:
  sport_key: basketball_wnba
  # Start with one market; add more later via markets list.
  market: player_points
  markets:
    - player_points
  regions: us
  # american | decimal — see DECISIONS.md
  odds_format: american
  raw_odds_dir: data/raw/odds
  # Committed sample used when data/raw/odds is empty under --dry-run.
  fixture_path: tests/fixtures/odds/event_odds_fixture.json
  # Quota projection inputs (scheduling itself is phase 10).
  snapshots_per_day: 4
  games_per_slate: 7
  # Intended capture times; near_tip is the closing line (phase 9 yardstick).
  capture_cadence:
    line_open: true
    midday: true
    hour_before_tip: true
    near_tip: true

# --- Phase 4: Features (all as-of tip-off; every k is tunable) ---
features:
  # Trailing windows for player form (games, not centered).
  form_windows: [3, 5, 10]
  # EWM half-life in games (pandas ewm halflife).
  ewm_halflife_games: 5
  # Regulation team player-minutes (WNBA 40-min game).
  team_minutes: 200
  # Rest: raw days_rest > long_break_days becomes category rest_long_break=1;
  # continuous days_rest is capped at long_break_days.
  long_break_days: 7
  # Shrinkage k = "prior games of evidence" in estimate=(n*obs+k*prior)/(n+k).
  # Larger k => more trust in prior. Opponent/teammate shrunk hard (tiny samples).
  shrinkage:
    player_form_k: 8
    usage_k: 10
    team_k: 12
    opponent_k: 20
    opponent_positional_k: 25
    teammate_hist_k: 30
    # Extra k added for expansion franchises (no franchise history).
    expansion_extra_k: 20
  expansion_team_abbreviations:
    - TOR
    - POR
  # Arena time zone by team abbreviation (for travel / tz_hours_crossed).
  team_timezones:
    ATL: America/New_York
    CHI: America/Chicago
    CON: America/New_York
    DAL: America/Chicago
    GS: America/Los_Angeles
    IND: America/Indiana/Indianapolis
    LA: America/Los_Angeles
    LV: America/Los_Angeles
    MIN: America/Chicago
    NY: America/New_York
    PHX: America/Phoenix
    POR: America/Los_Angeles
    SEA: America/Los_Angeles
    TOR: America/Toronto
    WSH: America/New_York

# --- Phase 5: Minutes model ---
minutes:
  # Time-based holdout only (never random split).
  train_end_season: 2024
  test_start_season: 2025
  # Regulation / OT team minutes (must match top-level).
  regulation_team_minutes: 200
  ot_team_minutes: 25
  # Share model: independent predicted shares renormalized to team total;
  # Dirichlet used for simulation noise (alpha_i = concentration * share_i).
  share_method: independent_normalize_dirichlet_sim
  dirichlet_concentration: 40.0
  # HistGradientBoosting hyperparameters
  max_depth: 4
  learning_rate: 0.08
  max_iter_classifier: 150
  max_iter_regressor: 200
  random_state: 0
  # Monte Carlo draws for interval estimates / sim checks
  n_sim: 400
  # Artifact paths
  models_dir: models
  dnp_calibration_plot: reports/dnp_calibration.png
  dnp_calibration_csv: reports/dnp_calibration.csv
  metrics_path: reports/minutes_metrics.json
