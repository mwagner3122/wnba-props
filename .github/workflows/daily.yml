# =============================================================================
# Phase 10 — Tier 2: daily update + project (GitHub Actions)
# =============================================================================
# What this file is: a "workflow". GitHub reads it and runs the steps below on a
# schedule (and when you click "Run workflow" manually).
#
# Line-by-line (zero-knowledge):
#   name:          Label shown in the Actions tab.
#   on.schedule:   Cron triggers (UTC). GitHub spins up a free Ubuntu VM.
#   on.workflow_dispatch: Lets you press a button to run it now (for testing).
#   jobs.*.runs-on: Which OS image (ubuntu-latest).
#   steps:         Ordered commands. Each `uses:` is a reusable action;
#                  each `run:` is a shell command on that VM.
#   env / secrets: ODDS_API_KEY comes from GitHub Secrets — NEVER put the key
#                  in this YAML. UI: Repo → Settings → Secrets and variables →
#                  Actions → New repository secret → name ODDS_API_KEY.
#
# Timing / DST (IMPORTANT):
#   Cron is ALWAYS UTC. Eastern Time shifts with daylight saving:
#     EDT (roughly Mar–Nov): Eastern = UTC−4
#     EST (roughly Nov–Mar): Eastern = UTC−5
#   The crons below target Eastern *clock* windows during EDT (summer WNBA).
#   When EST returns, each run is one hour earlier Eastern — still fine for
#   archive capture, just note it. Revisit crons if you need exact EST clocks.
#
#   Chosen times TOLERATE GitHub's routine ±10–30 minute (sometimes longer)
#   schedule delay. Do NOT use these for true T−5 closing-line capture.
#
#   Cron (UTC)     | Approx Eastern (EDT) | Intent
#   ---------------|----------------------|---------------------------
#   0 14 * * *     | 10:00 AM EDT         | Morning / line-open window
#   0 18 * * *     |  2:00 PM EDT         | Midday refresh
#   0 22 * * *     |  6:00 PM EDT         | Pre-tip for many evening tips
#   0 1 * * *      |  9:00 PM EDT         | Late / near-tip (NOT precise CLV)
#
# Other caveats:
#   - GitHub disables scheduled workflows after 60 days of repo inactivity.
#     Committing data/wnba.db daily counts as activity — you should be fine.
#   - Failure email: GitHub emails the user who triggered / the default if
#     you watch the repo. See docs/automation.md for Matt's deliberate-break
#     notification test steps.
#   - DB size: Git warns >50 MB, hard-limit 100 MB. See guide §14.3 / DECISIONS.
# =============================================================================

name: Daily update and project

on:
  schedule:
    # Morning / line-open (10:00 AM EDT). Delay-tolerant.
    - cron: "0 14 * * *"
    # Midday (2:00 PM EDT). Delay-tolerant.
    - cron: "0 18 * * *"
    # Pre-tip evening (6:00 PM EDT). Delay-tolerant; not T−5 closing.
    - cron: "0 22 * * *"
    # Late window (9:00 PM EDT). Delay-tolerant; not precise CLV.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: daily-update-project
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-project:
    runs-on: ubuntu-latest
    steps:
      # 1) Download this repository onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install uv (fast Python package manager used by this project).
      # Cache off: setup-uv enable-cache requires a committed uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      # 3) Create the virtualenv and install dependencies from pyproject/uv.lock.
      - name: Install Python dependencies
        run: uv sync

      # 4) Fetch new stats + odds. ODDS_API_KEY must be a GitHub Secret.
      - name: Run update (stats + odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python run.py update

      # 5) Loud failure if newest odds snapshot is >36h old (silent-failure catcher).
      - name: Staleness check
        run: uv run python run.py check-staleness

      # 6) Price today's slate. Needs trained models under models/ (gitignored by
      #    default). If models are missing, this step fails — update+DB commit still
      #    matter; commit models or train on a machine and push artifacts if you
      #    want project to succeed on Actions. continue-on-error keeps the archive
      #    commit alive when models are absent.
      - name: Run project
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python run.py project

      # 7) Commit updated data/wnba.db (and any new reports) back to the branch.
      - name: Commit database back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wnba.db reports/slate_priced.csv reports/hold_devig.csv logs/run_status.jsonl || true
          if git diff --staged --quiet; then
            echo "No DB/report changes to commit."
          else
            git commit -m "chore(automation): daily update snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
