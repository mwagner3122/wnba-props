[project]
name = "wnba-props"
version = "0.1.0"
description = "WNBA player prop projection model"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sportsdataverse>=0.0.75",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
